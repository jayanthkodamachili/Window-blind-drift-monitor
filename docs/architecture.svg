<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-label="Architecture of window-blind-drift-monitor"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8c959f"/></marker></defs><rect width="960" height="500" fill="#ffffff"/><text x="480.0" y="26" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#1b1f23">Two paths from one window: what fired, and what could have fired</text><rect x="24" y="56" width="196" height="54" rx="6" fill="#ffffff" stroke="#57606a" stroke-width="1.5"/><text x="122.0" y="76" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#1b1f23">reference window</text><text x="122.0" y="94" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#57606a">the stable baseline</text><rect x="24" y="134" width="196" height="54" rx="6" fill="#ffffff" stroke="#57606a" stroke-width="1.5"/><text x="122.0" y="154" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1b1f23">detection window</text><text x="122.0" y="172" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#57606a">n rows, and n decides</text><text x="122.0" y="186" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#57606a">everything below</text><line x1="122" y1="110" x2="122" y2="134" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/><rect x="286" y="70" width="290" height="56" rx="6" fill="#ffffff" stroke="#57606a" stroke-width="1.5"/><text x="431.0" y="90" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#1b1f23">run a detector per feature</text><text x="431.0" y="108" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#57606a">KS, chi-square or PSI</text><rect x="286" y="150" width="290" height="56" rx="6" fill="#ffffff" stroke="#57606a" stroke-width="1.5"/><text x="431.0" y="170" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#1b1f23">apply a multiplicity correction</text><text x="431.0" y="188" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#57606a">lowers alpha, raises the floor</text><line x1="220" y1="150" x2="286" y2="98" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/><line x1="576" y1="126" x2="431" y2="150" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/><rect x="286" y="258" width="290" height="68" rx="6" fill="#f2fbf4" stroke="#116329" stroke-width="1.5"/><text x="431.0" y="278" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1b1f23">bisect on shift size until power hits target</text><text x="431.0" y="296" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#57606a">what is the smallest shift</text><text x="431.0" y="310" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#57606a">this window could have seen?</text><line x1="220" y1="178" x2="286" y2="282" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/><rect x="646" y="70" width="180" height="56" rx="6" fill="#ffffff" stroke="#57606a" stroke-width="1.5"/><text x="736.0" y="90" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#1b1f23">fired</text><text x="736.0" y="108" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#57606a">an alarm to read</text><rect x="646" y="150" width="180" height="56" rx="6" fill="#fff5f4" stroke="#b42318" stroke-width="1.5"/><text x="736.0" y="170" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1b1f23">did not fire</text><text x="736.0" y="188" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#57606a">two meanings</text><rect x="646" y="258" width="180" height="68" rx="6" fill="#f2fbf4" stroke="#116329" stroke-width="1.5"/><text x="736.0" y="278" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#1b1f23">detection floor</text><text x="736.0" y="296" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#57606a">vs what would matter</text><line x1="576" y1="90" x2="646" y2="90" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/><line x1="576" y1="186" x2="646" y2="178" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/><line x1="576" y1="292" x2="646" y2="292" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/><rect x="150" y="392" width="660" height="78" rx="6" fill="#ffffff" stroke="#57606a" stroke-width="1.5"/><text x="480.0" y="412" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1b1f23">silence means nothing until the floor is known</text><text x="480.0" y="430" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#57606a">floor below what matters: nothing moved</text><text x="480.0" y="444" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#57606a">floor above what matters: the monitor could not have seen it either way</text><line x1="736" y1="206" x2="600" y2="392" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/><line x1="736" y1="326" x2="480" y2="392" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/><text x="253" y="128" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#57606a">same</text><text x="253" y="140" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#57606a">window</text></svg>
